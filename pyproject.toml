[project]
name = "web-scraper-bot"
version = "2.1.0"
description = "Telegram-controlled website monitor: detects page changes and smart-contract addresses."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE.md" }
dependencies = [
    "playwright>=1.49",
    "httpx>=0.27",
    "h2>=4.1",
    "lxml>=5.0",
    "base58>=2.1.1",
    "pycryptodome>=3.20",
    "python-dotenv>=1.0",
    "psutil>=5.9",
]

[project.urls]
Repository = "https://github.com/code-by-accident/Web-Scraper-Bot"
Documentation = "https://github.com/code-by-accident/Web-Scraper-Bot/tree/main/docs"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
scraper-bot = "scraper_bot.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["scraper_bot", "scraper_bot.chains", "scraper_bot.pages", "scraper_bot.monitoring", "scraper_bot.telegram"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
